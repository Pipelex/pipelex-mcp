# Verifies a release branch's version against the server it releases, and that
# a release into main is a real bump of that server and of nothing else. Runs on
# PRs into main (release branch → main) and on PRs into a release branch
# (dev/work → release branch) — the two places the version matters.
#
# The repository ships two servers, each on its own release track, and the
# release branch's name says which one is released:
#
#   release/vX.Y.Z          the workshop, packages/workshop/package.json
#   release/console-vX.Y.Z  the console,  packages/console/package.json
#
# Each track's version is read through `.github/scripts/track-version.sh`, which
# also reads a commit from before the workspace split, where one root
# package.json versioned both. Branch refs are read into env: and never
# interpolated into the shell, matching guard-branches.yml's injection-safe
# style. The version string has NO prefix in package.json (`v` and `console-v`
# live on the branch name and the git tag only).
name: Version check

on:
  pull_request:
    branches:
      - main
      - 'release/v[0-9]+.[0-9]+.[0-9]+'
      - 'release/console-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify version consistency
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Base: $BASE   Head: $HEAD"
          fail=0

          # The track and version a release branch names, or nothing.
          release_of() {
            if [[ "$1" =~ ^release/console-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "console ${BASH_REMATCH[1]}"
            elif [[ "$1" =~ ^release/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "workshop ${BASH_REMATCH[1]}"
            fi
          }

          # If the head OR the base is a release branch, the track it names must
          # carry the branch's version.
          RELEASED_TRACK=""
          for ref in "$HEAD" "$BASE"; do
            RELEASE=$(release_of "$ref")
            [ -z "$RELEASE" ] && continue
            read -r TRACK REL_VERSION <<< "$RELEASE"
            RELEASED_TRACK=$TRACK
            PR_VERSION=$(bash .github/scripts/track-version.sh "$TRACK" HEAD)
            if [[ "$PR_VERSION" != "$REL_VERSION" ]]; then
              echo "::error::The $TRACK's version ($PR_VERSION) does not match release branch version ($REL_VERSION) from '$ref'."
              fail=1
            else
              echo "The $TRACK's version matches release branch '$ref'."
            fi
          done

          # Targeting main: the released track's version must be strictly
          # greater than main's, and the other track's must not move at all, so
          # a release of one server can never ship the other.
          if [[ "$BASE" == "main" ]]; then
            if [[ -z "$RELEASED_TRACK" ]]; then
              echo "::error::Only a release branch may target main: release/vX.Y.Z for the workshop, release/console-vX.Y.Z for the console."
              exit 1
            fi
            for TRACK in workshop console; do
              PR_VERSION=$(bash .github/scripts/track-version.sh "$TRACK" HEAD)
              MAIN_VERSION=$(bash .github/scripts/track-version.sh "$TRACK" origin/main)
              if [[ "$TRACK" == "$RELEASED_TRACK" ]]; then
                GREATER=$(printf '%s\n%s\n' "$MAIN_VERSION" "$PR_VERSION" | sort -V | tail -n1)
                if [[ "$PR_VERSION" == "$MAIN_VERSION" || "$GREATER" != "$PR_VERSION" ]]; then
                  echo "::error::The $TRACK's version ($PR_VERSION) must be strictly greater than main's ($MAIN_VERSION). Bump it."
                  fail=1
                else
                  echo "The $TRACK is properly bumped from $MAIN_VERSION to $PR_VERSION."
                fi
              elif [[ "$PR_VERSION" != "$MAIN_VERSION" ]]; then
                echo "::error::This PR releases the $RELEASED_TRACK but also moves the $TRACK's version ($MAIN_VERSION -> $PR_VERSION)." \
                     "A release carries one server; release the $TRACK from its own release branch."
                fail=1
              else
                echo "The $TRACK stays at $MAIN_VERSION, as a $RELEASED_TRACK release requires."
              fi
            done
          fi

          exit $fail
