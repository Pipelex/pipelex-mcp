# Enforces the branch flow: work-branch → dev → release/vX.Y.Z → main.
# Catches wrong-target PRs early. This is convention enforcement, not security —
# real protection comes from the branch-protection ruleset on main.
#
# pipelex-mcp is a private, Alpic-deployed app with no npm publish, but it still
# promotes to main through a release/vX.Y.Z branch so the version bump + changelog
# land in one reviewable PR and the version/changelog CI checks have a branch name
# to validate against (see version-check.yml and changelog-check.yml). The
# `/release` skill (.claude/skills/release/) drives this flow.
#
# All PR refs flow through env: (never interpolated into the shell) so an
# attacker-controlled branch name can't inject commands.
name: Guard branch flow

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  # ─────────────────────────────────────────────────────────────
  # main  ←  release/vX.Y.Z   (release promotion to the deployable branch)
  # ─────────────────────────────────────────────────────────────
  gate-main:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only release/vX.Y.Z from this repo may target main
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          echo "PR → main from $HEAD ($HEAD_REPO)"
          if [[ "$HEAD_REPO" != "$REPO" ]]; then
            echo "::error::PRs to main must come from a release/vX.Y.Z branch in this repository, not a fork."
            exit 1
          fi
          if [[ ! "$HEAD" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only release/vX.Y.Z branches may merge into main. Use the /release skill to cut one."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────
  # dev  ←  work branches                  (everyday development)
  # release/vX.Y.Z  ←  dev / work branches (assembling a release)
  # ─────────────────────────────────────────────────────────────
  gate-dev:
    if: github.event.pull_request.base.ref == 'dev' || startsWith(github.event.pull_request.base.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Only work branches (or dev into a release) may target dev / a release branch
        env:
          HEAD: ${{ github.event.pull_request.head.ref }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "PR → $BASE from $HEAD"
          # dev may be promoted into a release branch to assemble the release.
          if [[ "$HEAD" == "dev" && "$BASE" =~ ^release/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            exit 0
          fi
          if [[ ! "$HEAD" =~ ^(fix|feature|refactor|chore|docs|ci-cd|changelog|codex)/[A-Za-z0-9._/=-]+$ ]]; then
            echo "::error::Branch must start with fix/, feature/, refactor/, chore/, docs/, ci-cd/, changelog/, or codex/."
            exit 1
          fi
