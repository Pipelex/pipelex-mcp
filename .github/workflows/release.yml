# Publishes the workshop, @pipelex/mcp (packages/workshop), to npm from
# `main`, and tags the release `vX.Y.Z`. Its version is the workshop's
# `package.json` version, read through `.github/scripts/track-version.sh`.
#
# It fires on the push to `main` — the merge of a `release/vX.Y.Z` pull
# request — so a release ships from the merge itself, the way every other
# library in this workspace publishes, and the landing gesture can verify the
# run keyed to the merge SHA. `workflow_dispatch` stays beside it for retrying
# after a partial failure, and is the only trigger that takes a typed
# `version`.
#
# What makes an unconditional on-merge trigger safe is that "is this push a
# release?" is answered from the pushed commit and from nothing else. The
# `detect` job reads the workshop's version at the pushed commit and at its
# first parent: a push is a release exactly when it brings `main` a version
# `main` did not have. That is a property of the commit, so it stays true
# however the registry, an earlier run or a break-glass publish left things,
# and everything else hangs off it — an ordinary push to `main` ends green with
# the gate, the publish and the tag skipped, without spending `make all` on
# it. What holds a bump to its release branch's name and to a strict increase
# is `version-check.yml`, on the pull request, before any of this.
#
# `guard` then decides whether that commit is shippable: the changelog must
# carry a matching `## [X.Y.Z]` heading, the whole `make all` gate is re-run on
# the merge commit rather than trusted from the pull request, and `npm view` is
# asked whether the version is already on the registry — an answer the
# registry could not give fails the run rather than being guessed at. That
# lookup is only what its name says, a double-publish guard: a release whose
# version reached npm by another route — the documented break-glass
# `make publish`, or a re-run of a run that published before it failed — skips
# the publish and still cuts the tag instead of ending green having shipped
# nothing. A dispatch answers to one check more, that the typed `version`
# equals what the commit carries, which is what refuses a run fired at the
# wrong bump.
#
# The commit the whole run ships is resolved once, by `detect`, and passed down
# as a SHA rather than as a branch name, so every job checks out what `detect`
# read and `guard` verified. A push pins its own merge commit. A dispatch reads
# `main` whatever ref it was fired from, so it cannot ship a feature branch, and
# it refuses to run at all unless that tip still brings a new version — a tip
# that does not is no longer that release's commit, and a retry must not ship a
# tree that landed on `main` after the release.
#
# Pinning a run to its own commit is what lets a re-run finish a release after
# `main` has moved on, and it must not let one finish a release `main` has moved
# PAST. That refusal — `.github/scripts/assert-not-behind-main.sh` — therefore
# runs inside the publish job and not only in `detect`: GitHub's "Re-run failed
# jobs" re-runs the jobs that failed and the jobs below them, so a job that
# succeeded is never re-executed and its outputs reach the re-run as the values
# it wrote before the newer release existed. `detect`'s own call is the cheap
# refusal on the ordinary path; the publish job's call is what protects it,
# since `npm publish` carries no `--tag` and so writes the `latest` dist-tag.
# Only the tag job needs nothing, because it leaves an existing tag alone.
#
# A release is re-runnable at the same version: the npm publish is skipped when
# that version already exists. Finish a partial failure by re-running the
# merge's own run, which finishes the release whatever npm already holds, or
# with a dispatch naming the same version (`-f version=X.Y.Z`). This is the
# /release skill's "retry at the same version" rule.
#
# One-time external setup: register `@pipelex/mcp` as a trusted publisher on
# npmjs.com (package settings) for `Pipelex/pipelex-mcp` with workflow filename
# `release.yml` — the same OIDC pattern `pipelex-sdk` and `mthds-js` use, so no
# long-lived npm secret exists anywhere. **The registration is bound to this
# filename**: renaming or moving this workflow breaks publishing until the
# trusted publisher is re-registered. Publishing from a workspace member
# changes nothing there: the registration names the repository and the
# workflow, not a directory.
name: Release (publish)

on:
  # The merge of a release pull request. The version is whatever `main`'s
  # workshop `package.json` says, and the workshop ships when it rose.
  push:
    branches:
      - main

  # The retry door, at a version typed by hand.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to ship — must match the workshop's package.json on main (e.g. 0.12.0, no prefix)"
        required: true
        type: string

permissions: {}

# One release at a time: a half-published run is worse than a queued one, and
# two overlapping releases would race for npm's `latest` tag, which is why the
# group is not keyed per commit. `cancel-in-progress` protects the run in
# flight but not a run still pending — a group holds one of each, and a third
# arrival cancels the pending one without anything turning red. So while a
# release run is in flight, a release merge queued behind it is evicted by the
# next push to `main`, whatever that push is: a queued run has not started, so
# it occupies the pending slot rather than passing through `detect` and
# leaving. That is accepted deliberately, and the acceptance rests on the
# landing rather than on the odds: it requires a successful run keyed to the
# merge SHA and the tag that run pushed, never merely a green newest run, so an
# evicted merge stops the landing instead of passing as a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Decide what this run ships
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The exact commit every job of this run checks out, resolved once here
      # so a dispatch pins what was read rather than re-reading `main` in each
      # job at whatever moment it happens to start.
      sha: ${{ steps.commit.outputs.sha }}
      # Whether that commit is a release — read from the commit, never from
      # the registry — and the version it carries.
      release: ${{ steps.commit.outputs.release }}
      version: ${{ steps.commit.outputs.version }}

    steps:
      - name: Checkout the commit to ship, and its parent
        uses: actions/checkout@v4
        with:
          # A push ships its own merge commit; a dispatch always reads `main`,
          # whatever ref it was fired from, so it cannot ship a feature branch.
          # Depth 2 is what makes the parent's manifest readable.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 2

      # Two comparisons, and each one closes a way of shipping a stale tree
      # under a version that is already out.
      #
      # Against the PARENT, the version must RISE rather than merely differ. A
      # revert that lowers it would otherwise read as a release: the changelog
      # heading for the old version is still there, and only the registry
      # lookup would stand between the reverted tree and a publish.
      # `version-check.yml` cannot cover that: it runs on pull requests only.
      #
      # Against `main`'s CURRENT tip, the version must not have been left
      # behind. That one is about re-runs rather than about merges, it is shared
      # with the publish job, and it is explained in the script both call:
      # `.github/scripts/assert-not-behind-main.sh`.
      - name: Compare the version with the one it replaces
        id: commit
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Both versions are read before anything is fetched: the freshness
          # script's shallow fetch of `main` can cut this checkout's history to
          # the tip, after which `HEAD^` is no longer there to read. Each read
          # is a plain assignment, because `set -e` sees a command
          # substitution's failure only there.
          CURRENT=$(bash .github/scripts/track-version.sh HEAD)
          BEFORE=$(bash .github/scripts/track-version.sh HEAD^)
          echo "version=${CURRENT}" >> "$GITHUB_OUTPUT"

          HIGHEST=$(printf '%s\n%s\n' "$BEFORE" "$CURRENT" | sort -V | tail -1)
          if [ "$CURRENT" != "$BEFORE" ] && [ "$HIGHEST" = "$CURRENT" ]; then
            # A run is pinned to its own commit, which is what lets a re-run
            # finish a release after `main` has moved on. It must not let one
            # finish a release `main` has moved PAST, so the same refusal runs
            # here and again inside the publish job — see the script.
            bash .github/scripts/assert-not-behind-main.sh "$CURRENT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Shipping the workshop at $CURRENT from $SHA — its first parent was at $BEFORE." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "release=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ]; then
            echo "$SHA keeps the workshop at $CURRENT (its first parent was at $BEFORE), so this push is not a release." \
                 "Nothing to publish or tag." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::main's tip $SHA does not raise the workshop's version above its parent's." \
               "A dispatch ships main's tip, and that tip is not a release commit — something" \
               "landed on main after the release merge, or no release has been cut. Fix main rather than shipping from it."
          exit 1

  guard:
    name: Verify main is shippable
    needs: detect
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      already_published: ${{ steps.published.outputs.already_published }}
      # Read from the workshop's `package.json` beside the lookup, so the run
      # summary the release play reads names whatever was actually published.
      package: ${{ steps.published.outputs.package }}

    steps:
      - name: Checkout the commit to ship
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}

      # A merge ships the version the release pull request brought with it, so
      # there is no typed number that could disagree with it. Only a dispatch
      # carries one, and it must name the version the commit actually holds.
      - name: Verify the typed version matches the commit
        if: github.event_name != 'push'
        env:
          REQUESTED: ${{ inputs.version }}
          ACTUAL: ${{ needs.detect.outputs.version }}
        run: |
          if [ "$ACTUAL" != "$REQUESTED" ]; then
            echo "::error::Requested the workshop at $REQUESTED but main carries it at $ACTUAL." \
                 "Did the release PR merge? Never edit the version here — cut it with the /release skill."
            exit 1
          fi

      - name: Verify the changelog has an entry for it
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # The heading carries no prefix — `v` lives on the branch and tag only.
          CHANGELOG=packages/workshop/CHANGELOG.md
          if ! grep -q "^## \[$VERSION\]" "$CHANGELOG"; then
            echo "::error::$CHANGELOG has no '## [$VERSION]' heading. Promote ## [Unreleased] before shipping."
            exit 1
          fi
          echo "$CHANGELOG has an entry for $VERSION."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The merge commit is what ships, and it is not always byte-identical to
      # what the PR gate saw. Re-run the full gate here rather than trust it.
      - name: Run quality checks and tests
        run: make all

      # The double-publish guard, and nothing more: whether this commit is a
      # release was settled by `detect`, so an answer here decides only whether
      # `npm publish` would collide. It still must never be a guess. `npm view`
      # reports `E404` when the version is genuinely absent, and some other
      # code — a rate limit, a 5xx, a DNS failure — when it could not find out;
      # only the first of those is an answer. An inconclusive lookup therefore
      # fails the guard rather than reading as "not published". The package is
      # read from the workshop's `package.json` rather than typed, so the
      # lookup cannot come to name something other than what `npm publish`
      # ships.
      - name: Check whether this version is already on npm
        id: published
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          PACKAGE=$(node -p "require('./packages/workshop/package.json').name")
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          if LOOKUP=$(npm view "$PACKAGE@$VERSION" version --json 2>&1); then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE@$VERSION is already on npm — the publish step will be skipped."
          elif printf '%s' "$LOOKUP" | grep -q 'E404'; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE@$VERSION is not on npm yet."
          else
            printf '%s\n' "$LOOKUP"
            echo "::error::Could not establish whether $PACKAGE@$VERSION is on npm —" \
                 "npm view failed without a 404. Refusing to guess; re-run once the registry answers."
            exit 1
          fi

  publish:
    name: Publish the workshop, @pipelex/mcp, to npm
    needs: [detect, guard]
    # Whether the version is already on npm gates the steps rather than the
    # job, so a release that reached the registry by another route still
    # reports the skip and still gets its tag. What keeps this job from
    # publishing a version `main` has moved past is its own freshness step
    # below, not `detect`'s.
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC token npm trusted publishing verifies

    steps:
      - name: Checkout the commit to ship
        if: needs.guard.outputs.already_published == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Setup Node.js
        if: needs.guard.outputs.already_published == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # `npm publish` is run without `--tag`, so it writes the `latest`
      # dist-tag: publishing 0.14.0 after 0.15.0 has shipped would point every
      # `npx @pipelex/mcp` at the older workshop. `detect` made this same
      # comparison, but a job that succeeded is not re-run by "Re-run failed
      # jobs", so its verdict reaches a partial re-run as a cached output that
      # predates the newer release. This job asks for itself, before anything
      # reaches the registry.
      - name: Refuse a version main has already moved past
        if: needs.guard.outputs.already_published == 'false'
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: bash .github/scripts/assert-not-behind-main.sh "$VERSION"

      - name: Update npm to support trusted publishing
        if: needs.guard.outputs.already_published == 'false'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: needs.guard.outputs.already_published == 'false'
        run: npm ci

      # The workshop member's `prepack` rebuilds `dist/main.js` and copies the
      # repository's README and licence in, so the tarball is built from this
      # commit rather than from whatever a previous step left behind. Auth is
      # OIDC trusted publishing — no token; `--provenance` is what binds the
      # published tarball to this workflow, this repo, and this commit.
      - name: Publish
        if: needs.guard.outputs.already_published == 'false'
        run: npm publish --workspace @pipelex/mcp --access public --provenance

      - name: Summary
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          SKIPPED: ${{ needs.guard.outputs.already_published }}
          PACKAGE: ${{ needs.guard.outputs.package }}
        run: |
          if [ "$SKIPPED" = "true" ]; then
            echo "Skipped: $PACKAGE@$VERSION was already published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published $PACKAGE@$VERSION to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

  tag:
    name: Tag the release
    needs: [detect, publish]
    # Reached only when the publish job succeeded in this run, whether it
    # published or found the version already there. On a run that releases
    # nothing, `publish` is skipped and the skip propagates down `needs`.
    if: needs.detect.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the commit to ship
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Create and push the tag
        env:
          TAG: v${{ needs.detect.outputs.version }}
        run: |
          # The `v` prefix lives on the tag, never in package.json or the changelog heading.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — leaving it alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "Tagged $TAG at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
