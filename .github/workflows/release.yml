# Ships the two release surfaces from `main`: the public `@pipelex/mcp` npm
# package (local workshop) and the Skybridge server on Alpic (hosted console).
#
# It fires on the push to `main` — the merge of a `release/vX.Y.Z` pull
# request — so a release ships from the merge itself, the way every other
# library in this workspace publishes, and the landing gesture can verify the
# run keyed to the merge SHA. `workflow_dispatch` stays beside it for the
# one-leg retry after a partial failure, and is the only trigger that takes a
# typed `version`.
#
# What makes an unconditional on-merge trigger safe is the `guard` job, whose
# checks are also what decide whether a given push is a release at all:
# `main`'s `package.json` version must have a matching `## [X.Y.Z]` heading in
# `CHANGELOG.md`, the whole `make all` gate is re-run on the merge commit
# rather than trusted from the pull request, and `npm view` is asked whether
# that version is already on the registry. A push to `main` that is not a
# release therefore carries a version that has already shipped, and ends green
# with both legs skipped. A dispatch answers to one check more — the typed
# `version` must equal `main`'s `package.json` — which is what refuses a run
# fired before the release pull request merged, or fired at the wrong bump.
#
# A dispatch always checks out `main` whatever ref it was fired from, so it
# cannot ship a feature branch by accident. A push checks out its own
# `github.sha`, so the tree that ships, the provenance npm records and the
# `vX.Y.Z` tag all name the merge commit that triggered the run rather than
# whatever else has reached `main` since.
#
# Both surfaces are re-runnable at the same version: an npm publish is skipped
# when that version already exists, and Alpic deploys are idempotent per commit.
# Finish a partial failure with a dispatch that names the leg (`-f target=npm`
# or `-f target=alpic`, same version) rather than by re-running the push —
# once npm holds the version, a push-triggered run skips both legs, which is
# the very rule that keeps a non-release push quiet. This is the /release
# skill's "retry at the same version" rule.
#
# One-time external setup:
#   - npm: register `@pipelex/mcp` as a trusted publisher on npmjs.com
#     (package settings) for `Pipelex/pipelex-mcp` with workflow filename
#     `release.yml` — the same OIDC pattern `pipelex-sdk-js` and `mthds-js`
#     use, so no long-lived npm secret exists anywhere. **The registration is
#     bound to this filename**: renaming or moving this workflow breaks
#     publishing until the trusted publisher is re-registered.
#   - `ALPIC_API_KEY` repo secret (Alpic dashboard → API key). The project and
#     environment ids come from the tracked `.alpic/project.json`.
name: Release (publish + deploy)

on:
  # The merge of a release pull request. `version` is then whatever `main`'s
  # `package.json` says and both surfaces ship together.
  push:
    branches:
      - main

  # The retry door: one leg at a time, at a version typed by hand.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to ship — must match package.json on main (e.g. 0.12.0, no "v")'
        required: true
        type: string
      target:
        description: 'Which surfaces to ship (use a single one only to retry a partial failure)'
        required: true
        default: both
        type: choice
        options:
          - both
          - npm
          - alpic

permissions: {}

# Never cancel a release in flight: a half-published run is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Verify main is shippable
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The commit the whole run ships: its own merge commit on a push, the tip
      # of `main` on a dispatch — which is what keeps a dispatch from shipping
      # the branch it was fired from.
      ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      # A merge ships both surfaces; only a dispatch may narrow to one leg.
      target: ${{ github.event_name == 'push' && 'both' || inputs.target }}
      version: ${{ steps.version.outputs.version }}
      already_published: ${{ steps.published.outputs.already_published }}

    steps:
      - name: Checkout the commit to ship
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}

      - name: Resolve the version and verify it matches package.json
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.version }}
        run: |
          ACTUAL=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = "push" ]; then
            # A merge ships the version the release pull request brought with
            # it, so there is no typed number that could disagree with it.
            REQUESTED="$ACTUAL"
          fi
          if [ "$ACTUAL" != "$REQUESTED" ]; then
            echo "::error::Requested $REQUESTED but main's package.json is $ACTUAL." \
                 "Did the release PR merge? Never edit the version here — cut it with the /release skill."
            exit 1
          fi
          echo "version=$ACTUAL" >> "$GITHUB_OUTPUT"
          echo "Shipping $ACTUAL from $(git rev-parse HEAD)"

      - name: Verify the changelog has an entry for it
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The heading carries no `v` — that prefix lives on the branch and tag only.
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' heading. Promote ## [Unreleased] before shipping."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The merge commit is what ships, and it is not always byte-identical to
      # what the PR gate saw. Re-run the full gate here rather than trust it.
      - name: Run quality checks and tests
        run: make all

      - name: Check whether this version is already on npm
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@pipelex/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "@pipelex/mcp@$VERSION is already on npm — the publish step will be skipped."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish @pipelex/mcp to npm
    needs: guard
    # A dispatch may narrow the target; a push skips the leg outright when the
    # version it carries is already on npm, which is what turns a push to
    # `main` that is not a release into a green no-op.
    if: >-
      needs.guard.outputs.target != 'alpic'
      && (github.event_name != 'push' || needs.guard.outputs.already_published == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC token npm trusted publishing verifies

    steps:
      - name: Checkout the commit to ship
        if: needs.guard.outputs.already_published == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.ref }}

      - name: Setup Node.js
        if: needs.guard.outputs.already_published == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to support trusted publishing
        if: needs.guard.outputs.already_published == 'false'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: needs.guard.outputs.already_published == 'false'
        run: npm ci

      # `prepack` rebuilds dist/local/main.js, so the tarball is built from this
      # commit rather than from whatever a previous step happened to leave behind.
      # Auth is OIDC trusted publishing — no token; `--provenance` is what binds
      # the published tarball to this workflow, this repo, and this commit.
      - name: Publish
        if: needs.guard.outputs.already_published == 'false'
        run: npm publish --access public --provenance

      - name: Summary
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          SKIPPED: ${{ needs.guard.outputs.already_published }}
        run: |
          if [ "$SKIPPED" = "true" ]; then
            echo "Skipped: @pipelex/mcp@$VERSION was already published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published @pipelex/mcp@$VERSION to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy the hosted console to Alpic
    needs: guard
    # The same shape as the npm leg: a dispatch may narrow, and on a push an
    # already-published version is the signal that this commit is not a release
    # and there is nothing new to deploy.
    if: >-
      needs.guard.outputs.target != 'npm'
      && (github.event_name != 'push' || needs.guard.outputs.already_published == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the commit to ship
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Project/team/environment ids come from the tracked `.alpic/project.json`,
      # so this needs no ids of its own — only the API key. `--non-interactive`
      # makes a missing or stale link fail loudly instead of hanging on a prompt.
      - name: Deploy
        env:
          ALPIC_API_KEY: ${{ secrets.ALPIC_API_KEY }}
        run: |
          if [ -z "$ALPIC_API_KEY" ]; then
            echo "::error::ALPIC_API_KEY repo secret is not set — cannot deploy the console."
            exit 1
          fi
          npx alpic deploy --non-interactive

      - name: Summary
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: echo "Deployed the hosted console at $VERSION to Alpic." >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag the released commit
    needs: [guard, publish, deploy]
    # Only when both surfaces shipped in this run — a single-target retry is by
    # definition finishing a release whose tag either exists or is not yet earned.
    if: needs.guard.outputs.target == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the commit to ship
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.ref }}

      - name: Create and push the tag
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          # The `v` prefix lives on the tag, never in package.json or the changelog heading.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — leaving it alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "Tagged v$VERSION at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
