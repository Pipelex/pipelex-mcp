# Ships the two release surfaces from `main`: the public `@pipelex/mcp` npm
# package (local workshop) and the Skybridge server on Alpic (hosted console).
#
# It fires on the push to `main` — the merge of a `release/vX.Y.Z` pull
# request — so a release ships from the merge itself, the way every other
# library in this workspace publishes, and the landing gesture can verify the
# run keyed to the merge SHA. `workflow_dispatch` stays beside it for the
# one-leg retry after a partial failure, and is the only trigger that takes a
# typed `version`.
#
# What makes an unconditional on-merge trigger safe is that "is this push a
# release?" is answered from the pushed commit and from nothing else. The
# `detect` job reads `package.json`'s version at the pushed commit and at its
# first parent: a push is a release exactly when it brings `main` a version
# `main` did not have. That is a property of the commit, so it stays true
# however the registry, an earlier run or a break-glass publish left things,
# and everything else hangs off it — an ordinary push to `main` ends green
# with the gate, both surfaces and the tag all skipped, without spending
# `make all` on it. What holds the bump to the branch name and to a strict
# increase is `version-check.yml`, on the pull request, before any of this.
#
# `guard` then decides whether that commit is shippable: `CHANGELOG.md` must
# carry a matching `## [X.Y.Z]` heading, the whole `make all` gate is re-run on
# the merge commit rather than trusted from the pull request, and `npm view` is
# asked whether the version is already on the registry — an answer the registry
# could not give fails the run rather than being guessed at. That lookup is now
# only what its name says, a double-publish guard on the npm leg. Its *answer*
# gates the npm leg and nothing else, so a release whose version reached npm by
# another route — the documented break-glass `make publish`, or a re-run of a
# run that published before it failed — still deploys the console and still
# cuts the tag instead of ending green having shipped nothing. Its *failure*
# still stops a run that includes the npm leg, because a run that cannot know
# whether it would double-publish must not try; the console-only retry door is
# what is kept clear of it, by skipping the lookup outright on `-f target=alpic`
# so an unreachable registry cannot block the leg it has no say over. A
# dispatch answers to one check more, that the typed `version` equals what the
# commit carries, which is what refuses a run fired at the wrong bump.
#
# The commit the whole run ships is resolved once, by `detect`, and passed down
# as a SHA rather than as a branch name, so every job checks out what `detect`
# read and `guard` verified. A push pins its own merge commit. A dispatch reads
# `main` whatever ref it was fired from, so it cannot ship a feature branch, and
# it refuses to run at all unless that tip still brings a new version — a tip
# that does not is no longer the release commit, and a retry must not ship a
# tree that landed on `main` after the release.
#
# Both surfaces are re-runnable at the same version: an npm publish is skipped
# when that version already exists, and Alpic deploys are idempotent per commit.
# Finish a partial failure with a dispatch that names the leg (`-f target=npm`
# or `-f target=alpic`, same version), or by re-running the merge's own run,
# which now finishes the release whatever npm already holds. This is the
# /release skill's "retry at the same version" rule.
#
# One-time external setup:
#   - npm: register `@pipelex/mcp` as a trusted publisher on npmjs.com
#     (package settings) for `Pipelex/pipelex-mcp` with workflow filename
#     `release.yml` — the same OIDC pattern `pipelex-sdk-js` and `mthds-js`
#     use, so no long-lived npm secret exists anywhere. **The registration is
#     bound to this filename**: renaming or moving this workflow breaks
#     publishing until the trusted publisher is re-registered.
#   - `ALPIC_API_KEY` repo secret (Alpic dashboard → API key). The project and
#     environment ids come from the tracked `.alpic/project.json`.
name: Release (publish + deploy)

on:
  # The merge of a release pull request. `version` is then whatever `main`'s
  # `package.json` says and both surfaces ship together.
  push:
    branches:
      - main

  # The retry door: one leg at a time, at a version typed by hand.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to ship — must match package.json on main (e.g. 0.12.0, no "v")'
        required: true
        type: string
      target:
        description: 'Which surfaces to ship (use a single one only to retry a partial failure)'
        required: true
        default: both
        type: choice
        options:
          - both
          - npm
          - alpic

permissions: {}

# One release at a time: a half-published run is worse than a queued one, and
# two overlapping releases would race for npm's `latest` tag, which is why the
# group is not keyed per commit. `cancel-in-progress` protects the run in
# flight but not a run still pending — a group holds one of each, and a third
# arrival cancels the pending one without anything turning red. So while a
# release run is in flight, a release merge queued behind it is evicted by the
# next push to `main`, whatever that push is: a queued run has not started, so
# it occupies the pending slot rather than passing through `detect` and
# leaving. That is accepted deliberately, and the acceptance rests on the
# landing rather than on the odds: it requires a successful run keyed to the
# merge SHA and the tag that run pushed, never merely a green newest run, so an
# evicted merge stops the landing instead of passing as a release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    name: Decide what this run ships
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # The exact commit every job of this run checks out, resolved once here
      # so a dispatch pins what was read rather than re-reading `main` in each
      # job at whatever moment it happens to start.
      sha: ${{ steps.commit.outputs.sha }}
      # Whether that commit is a release at all — read from the commit, never
      # from the registry.
      is_release: ${{ steps.commit.outputs.is_release }}
      version: ${{ steps.commit.outputs.version }}
      # A merge ships both surfaces; only a dispatch may narrow to one leg.
      target: ${{ github.event_name == 'push' && 'both' || inputs.target }}

    steps:
      - name: Checkout the commit to ship, and its parent
        uses: actions/checkout@v4
        with:
          # A push ships its own merge commit; a dispatch always reads `main`,
          # whatever ref it was fired from, so it cannot ship a feature branch.
          # Depth 2 is what makes the parent's `package.json` readable.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 2

      # The version must RISE, not merely differ. A revert that lowers it would
      # otherwise read as a release: the changelog heading for the old version
      # is still there, `npm view` finds the version published and skips the npm
      # leg, and the console leg — which no longer reads the registry — would
      # push the reverted tree to Production under a version already tagged.
      # `version-check.yml` cannot cover that: it runs on pull requests only.
      - name: Compare the version it brings with the one it replaces
        id: commit
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./package.json').version")
          git show "HEAD^:package.json" > "$RUNNER_TEMP/parent-package.json"
          PARENT=$(node -p "require('$RUNNER_TEMP/parent-package.json').version")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          HIGHEST=$(printf '%s\n%s\n' "$PARENT" "$VERSION" | sort -V | tail -1)
          if [ "$VERSION" != "$PARENT" ] && [ "$HIGHEST" = "$VERSION" ]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Shipping $VERSION from $SHA — main was at $PARENT."
            exit 0
          fi

          echo "is_release=false" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "push" ]; then
            echo "$SHA does not raise the version above $PARENT, so this push is not a release." \
                 "Nothing to publish, deploy or tag." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::main's tip $SHA does not raise the version above $PARENT." \
               "A dispatch ships main's tip, and that tip is not a release commit — something landed on main" \
               "after the release merge, or no release has been cut. Fix main rather than shipping from it."
          exit 1

  guard:
    name: Verify main is shippable
    needs: detect
    if: needs.detect.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      already_published: ${{ steps.published.outputs.already_published }}
      # Read from `package.json` beside the lookup, so the run summary the
      # release play reads names whatever was actually published.
      package: ${{ steps.published.outputs.package }}

    steps:
      - name: Checkout the commit to ship
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}

      # A merge ships the version the release pull request brought with it, so
      # there is no typed number that could disagree with it. Only a dispatch
      # carries one, and it must name the version the commit actually holds.
      - name: Verify the typed version matches the commit
        if: github.event_name != 'push'
        env:
          REQUESTED: ${{ inputs.version }}
          ACTUAL: ${{ needs.detect.outputs.version }}
        run: |
          if [ "$ACTUAL" != "$REQUESTED" ]; then
            echo "::error::Requested $REQUESTED but main's package.json is $ACTUAL." \
                 "Did the release PR merge? Never edit the version here — cut it with the /release skill."
            exit 1
          fi

      - name: Verify the changelog has an entry for it
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # The heading carries no `v` — that prefix lives on the branch and tag only.
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' heading. Promote ## [Unreleased] before shipping."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The merge commit is what ships, and it is not always byte-identical to
      # what the PR gate saw. Re-run the full gate here rather than trust it.
      - name: Run quality checks and tests
        run: make all

      # The double-publish guard on the npm leg, and nothing more: whether this
      # commit is a release was settled by `detect`, so an answer here decides
      # only whether `npm publish` would collide. It still must never be a
      # guess. `npm view` reports `E404` when the version is genuinely absent,
      # and some other code — a rate limit, a 5xx, a DNS failure — when it could
      # not find out; only the first of those is an answer. An inconclusive
      # lookup therefore fails the guard rather than reading as "not published".
      # The package is read from `package.json` rather than typed, so the lookup
      # cannot come to name something other than what `npm publish` ships.
      # Skipped outright when the run does not include the npm leg, so that an
      # unreachable registry cannot fail the guard and take the console leg and
      # the tag down with it — which would break the one retry door (`-f
      # target=alpic`) whose whole purpose is to ship the console when npm is
      # what went wrong. The `publish` job is skipped for that target, so
      # nothing reads the output this leaves empty.
      - name: Check whether this version is already on npm
        id: published
        if: needs.detect.outputs.target != 'alpic'
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          if LOOKUP=$(npm view "$PACKAGE@$VERSION" version --json 2>&1); then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE@$VERSION is already on npm — the publish step will be skipped."
          elif printf '%s' "$LOOKUP" | grep -q 'E404'; then
            echo "already_published=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE@$VERSION is not on npm yet."
          else
            printf '%s\n' "$LOOKUP"
            echo "::error::Could not establish whether $PACKAGE@$VERSION is on npm —" \
                 "npm view failed without a 404. Refusing to guess; re-run once the registry answers."
            exit 1
          fi

  publish:
    name: Publish @pipelex/mcp to npm
    needs: [detect, guard]
    # Only a dispatch may narrow the target. Whether the version is already on
    # npm gates the steps rather than the job, so a release that reached the
    # registry by another route still reports the skip and still lets the
    # console and the tag go out.
    if: needs.detect.outputs.target != 'alpic'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mints the OIDC token npm trusted publishing verifies

    steps:
      - name: Checkout the commit to ship
        if: needs.guard.outputs.already_published == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Setup Node.js
        if: needs.guard.outputs.already_published == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to support trusted publishing
        if: needs.guard.outputs.already_published == 'false'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: needs.guard.outputs.already_published == 'false'
        run: npm ci

      # `prepack` rebuilds dist/local/main.js, so the tarball is built from this
      # commit rather than from whatever a previous step happened to leave behind.
      # Auth is OIDC trusted publishing — no token; `--provenance` is what binds
      # the published tarball to this workflow, this repo, and this commit.
      - name: Publish
        if: needs.guard.outputs.already_published == 'false'
        run: npm publish --access public --provenance

      - name: Summary
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          SKIPPED: ${{ needs.guard.outputs.already_published }}
          PACKAGE: ${{ needs.guard.outputs.package }}
        run: |
          if [ "$SKIPPED" = "true" ]; then
            echo "Skipped: $PACKAGE@$VERSION was already published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published $PACKAGE@$VERSION to npm." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    name: Deploy the hosted console to Alpic
    needs: [detect, guard]
    # A dispatch may narrow the target; nothing else gates this leg. A release
    # deploys the console whatever npm already holds — the two surfaces go out
    # in lockstep at the same commit, and the registry has no say in it.
    if: needs.detect.outputs.target != 'npm'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the commit to ship
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Project/team/environment ids come from the tracked `.alpic/project.json`,
      # so this needs no ids of its own — only the API key. `--non-interactive`
      # makes a missing or stale link fail loudly instead of hanging on a prompt.
      - name: Deploy
        env:
          ALPIC_API_KEY: ${{ secrets.ALPIC_API_KEY }}
        run: |
          if [ -z "$ALPIC_API_KEY" ]; then
            echo "::error::ALPIC_API_KEY repo secret is not set — cannot deploy the console."
            exit 1
          fi
          npx alpic deploy --non-interactive

      - name: Summary
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: echo "Deployed the hosted console at $VERSION to Alpic." >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag the released commit
    needs: [detect, publish, deploy]
    # Only when both surfaces shipped in this run — a single-target retry is by
    # definition finishing a release whose tag either exists or is not yet
    # earned. On a push that is not a release this condition is never reached:
    # `detect` skips `guard`, and a skip propagates down `needs`.
    if: needs.detect.outputs.target == 'both'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the commit to ship
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Create and push the tag
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # The `v` prefix lives on the tag, never in package.json or the changelog heading.
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists — leaving it alone." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"
          echo "Tagged v$VERSION at $(git rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
