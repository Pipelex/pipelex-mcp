# Runs the full quality gate (`make all` = clean + lint + format:check +
# typecheck + build + test) on every PR. Its status check is meant to be
# required by the branch-protection ruleset before anything can merge.
#
# Unlike the sibling TS repos, `@pipelex/sdk` is consumed as a published npm
# package (not a `file:../pipelex-sdk-js` link), so CI needs nothing more than
# `npm ci` — there is no sibling repo to check out and build.
name: Quality Checks

on:
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels the previous, still-running check for that PR.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks and tests
        run: make all
