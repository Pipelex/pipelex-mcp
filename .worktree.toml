# Read only by `wt` — the grammar is the workspace's docs/workspace/worktrees.md, "What a repo declares".

# Three workspace members require `@pipelex/sdk` (the core, the workshop and the console), and npm hoists
# the one copy they share to the repository root, so a sprint pin needs only one site. It goes in the core:
# the core is where the capability code that reads the SDK lives, and it is private and never published, so
# a git source there can never reach the manifest of the workshop that npm publishes. The other two keep
# their registry range, which the pinned commit satisfies as long as its version stays inside it, and they
# resolve to the same hoisted copy.
[pins."@pipelex/sdk"]
site = "packages/core/package.json"
